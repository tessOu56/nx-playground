# Local Postgres for Nest (T-240). pgvector image so CREATE EXTENSION vector works.
# Product hosted DB remains the existing Neon event-stack project.
services:
  event-stack-db:
    image: pgvector/pgvector:pg16
    container_name: nx-event-stack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: event
      POSTGRES_PASSWORD: event
      POSTGRES_DB: event_stack
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U event -d event_stack']
      interval: 5s
      timeout: 5s
      retries: 10
