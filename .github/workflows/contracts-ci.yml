name: contracts-ci

on:
  push:
    branches: [main]
    paths:
      - 'libs/contracts/**'
      - 'libs/api-client/specs/**'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    paths:
      - 'libs/contracts/**'
      - 'libs/api-client/specs/**'
  workflow_dispatch:

jobs:
  typespec-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1
      # T-2026-028: pnpm-lock.yaml is reconciled (vue-motion pinia included); root frozen
      # install now works in CI, so contracts no longer needs an isolated npm toolchain.
      - name: Install workspace deps (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: tsp compile
        working-directory: libs/contracts
        run: npx tsp compile main.tsp --config tspconfig.yaml
      - name: verify OpenAPI artifacts
        run: |
          test -f libs/api-client/specs/catalog.openapi.yaml
          test -f libs/api-client/specs/event.openapi.yaml
          test -f libs/api-client/specs/media.openapi.yaml
