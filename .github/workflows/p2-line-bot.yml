name: P2 LINE bot and Taipei collector tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.28.8

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema=apps/api-server/prisma/schema.prisma

      - name: LINE bot unit tests
        run: |
          node --import tsx --test \
            apps/event-portal/src/libs/http/*.test.ts \
            apps/event-portal/src/libs/line/*.test.ts \
            apps/event-portal/src/libs/line/bot/*.test.ts \
            apps/event-portal/src/libs/auth/*.test.ts \
            apps/event-portal/src/app/api/line/webhook/route.test.ts

      - name: Collector tests (Taipei + Tokyo)
        run: |
          node --import tsx --test \
            tools/collectors/shared/*.test.ts \
            tools/collectors/moc-taipei/*.test.ts \
            tools/collectors/tokyo/*.test.ts

      - name: Nest mutating API and payment callback tests
        run: pnpm exec nx test @nx-playground/api-server --skip-nx-cache

      - name: CMS BFF fail-closed auth tests
        run: pnpm exec nx test @nx-playground/event-cms --skip-nx-cache

      - name: Auth-client session mapping tests
        run: pnpm exec nx test auth-client --skip-nx-cache

      - name: Auth app portal-redirect tests
        run: pnpm exec nx test @nx-playground/auth --skip-nx-cache
