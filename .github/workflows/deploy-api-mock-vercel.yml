name: Deploy nx-event-stack-api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api-mock/**'
      - 'libs/api-fixtures/**'
      - 'libs/api-client/specs/event-stack.openapi.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-api-mock
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_API_MOCK_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.28.8

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy api-mock to Vercel production
        working-directory: apps/api-mock
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_MOCK_PROJECT_ID }}
        run: |
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify health
        run: |
          curl -sfS 'https://nx-event-stack-api.vercel.app/api/health' | tee /tmp/health.json
          grep -q '"storage":"memory"' /tmp/health.json
