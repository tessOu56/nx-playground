name: Tokyo exhibition collectors

on:
  schedule:
    # 03:00 Asia/Tokyo = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check COLLECTOR_DATABASE_URL secret
        id: check
        env:
          COLLECTOR_DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
        run: |
          if [ -z "$COLLECTOR_DATABASE_URL" ]; then
            echo "COLLECTOR_DATABASE_URL repo secret is not set; skipping Tokyo collectors."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.check.outputs.skip != 'true'
        with:
          version: 11.28.8

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.check.outputs.skip != 'true'
        run: pnpm exec prisma generate --schema=apps/api-server/prisma/schema.prisma

      - name: Apply migrations
        if: steps.check.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL (owner) is not set; skip migrate deploy."
            echo "Apply migrations with the owner role before the first collector run."
            exit 0
          fi
          pnpm exec prisma migrate deploy --schema=apps/api-server/prisma/schema.prisma

      - name: Collect Tokyo exhibitions
        if: steps.check.outputs.skip != 'true'
        env:
          COLLECTOR_DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
        run: pnpm exec tsx tools/collectors/tokyo/run.ts

      - name: Backfill exhibition embeddings
        if: steps.check.outputs.skip != 'true'
        env:
          COLLECTOR_DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_API_BASE_URL: ${{ vars.EMBEDDING_API_BASE_URL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS }}
        run: pnpm exec tsx apps/api-server/src/modules/embeddings/run-backfill.ts
