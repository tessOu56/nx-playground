name: P3 exhibition search

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.28.8

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Exhibition search unit tests
        run: |
          node --import tsx --test \
            apps/event-portal/src/libs/http/*.test.ts \
            apps/event-portal/src/libs/exhibition-search/*.test.ts \
            apps/event-portal/src/app/api/exhibitions/search/route.test.ts \
            apps/event-portal/src/libs/line/bot/*.test.ts \
            apps/event-portal/src/libs/line/exhibition-share.test.ts \
            apps/event-portal/src/libs/line/login-return.test.ts \
            apps/event-portal/src/libs/api/catalog-query.test.ts \
            apps/event-portal/src/libs/api/catalog-search-ui.test.ts \
            apps/event-portal/src/libs/api/catalog-highlight.test.ts \
            apps/event-portal/src/libs/api/catalog-image.test.ts \
            apps/event-portal/src/libs/api/event-stack-map.test.ts \
            apps/event-portal/src/libs/api/portal-event-error.test.ts \
            apps/event-portal/src/libs/i18n/demo-copy.test.ts \
            apps/event-portal/src/components/editor/utils.test.ts \
            tools/collectors/shared/*.test.ts \
            tools/collectors/moc-taipei/*.test.ts \
            tools/collectors/tokyo/*.test.ts

      - name: Embedding pipeline unit tests
        run: pnpm exec nx test @nx-playground/api-server --skip-nx-cache
