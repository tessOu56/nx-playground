packages:
  # Product apps (event-portal + LINE, event-cms, api-server, api-mock, auth)
  - 'apps/*'
  - 'events'

  # Libraries
  - 'libs/*'

  # labs/ (vue-motion, enterprise-admin) is archived — not a workspace package.
  # See labs/README.md. Canonical Vue/Angular: vue-motion-sandbox / angular-dashboard-sandbox.

# Migrated from .npmrc (pnpm 11 reads project settings from this file only).
frozenLockfile: true
autoInstallPeers: false
strictPeerDependencies: false
ignoreScripts: true
strictSsl: true

# pnpm 11 replaced onlyBuiltDependencies with allowBuilds.
# ignoreScripts keeps the previous default install (no husky / dep postinstalls).
# This allowlist is the approved set when scripts are enabled.
allowBuilds:
  '@nestjs/core': false
  '@openapitools/openapi-generator-cli': false
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  msw: false
  nx: true
  prisma: true
  sharp: true
  style-dictionary: false
  unrs-resolver: true
  yorkie: false

# Migrated from package.json#pnpm (pnpm 11 no longer reads that field).
overrides:
  react: '19.3.1'
  react-dom: '19.3.1'
  react-router-dom: '7.18.4'
  tmp@<=0.2.3: '>=0.2.4'
  next: '16.4.2'
  sharp: '0.35.5'
  react-hook-form: '7.62.0'
  '@is_tess/tokens': '^0.1.2'
  axios: '1.20.0'
  swiper: '12.1.2'
